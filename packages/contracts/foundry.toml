[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
# Base soporta Cancun (EIP-1153/MCOPY) desde Ecotone.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
# ABIs + metadata que consume packages/shared en la Fase 2.
extra_output_files = ["abi"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 10_000

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"

# Etherscan API v2: una sola key sirve para Basescan (8453) y Base Sepolia (84532).
[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
